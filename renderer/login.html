<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考试监控系统 - 志愿者配置</title>
    <style>
      body {
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: #f4f5f7;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
      }
      .container {
        background-color: #fff;
        width: 450px;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #1a73e8;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #1a73e8;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #0d62c9;
      }
      .error {
        color: #d93025;
        font-size: 14px;
        margin-top: 5px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>考试监控系统</h1>
      <div id="login-form">
        <div class="form-group">
          <label for="server-ip">服务器IP地址</label>
          <input type="text" id="server-ip" placeholder="例如: 192.168.1.100" />
          <div class="error" id="server-ip-error">请输入有效的服务器IP地址</div>
        </div>
        <div class="form-group">
          <label for="server-port">服务器端口</label>
          <input
            type="text"
            id="server-port"
            placeholder="例如: 8080"
            value="8080"
          />
          <div class="error" id="server-port-error">请输入有效的端口号</div>
        </div>
        <div class="form-group">
          <label for="password">访问密码</label>
          <input
            type="password"
            id="password"
            placeholder="请输入服务器访问密码"
          />
          <div class="error" id="password-error">密码不能为空</div>
        </div>
        <div class="form-group">
          <label for="machine-number">考试机号</label>
          <input type="text" id="machine-number" placeholder="例如: 14" />
          <div class="error" id="machine-number-error">
            请输入有效的考试机号
          </div>
        </div>
        <button id="login-button">登录</button>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      // 获取DOM元素
      const serverIpInput = document.getElementById("server-ip");
      const serverPortInput = document.getElementById("server-port");
      const passwordInput = document.getElementById("password");
      const machineNumberInput = document.getElementById("machine-number");
      const loginButton = document.getElementById("login-button");

      // 验证表单
      function validateForm() {
        let isValid = true;

        // 验证服务器IP
        if (!serverIpInput.value.trim()) {
          document.getElementById("server-ip-error").style.display = "block";
          isValid = false;
        } else {
          document.getElementById("server-ip-error").style.display = "none";
        }

        // 验证服务器端口
        const portValue = serverPortInput.value.trim();
        if (
          !portValue ||
          isNaN(portValue) ||
          portValue < 1 ||
          portValue > 65535
        ) {
          document.getElementById("server-port-error").style.display = "block";
          isValid = false;
        } else {
          document.getElementById("server-port-error").style.display = "none";
        }

        // 验证密码
        if (!passwordInput.value.trim()) {
          document.getElementById("password-error").style.display = "block";
          isValid = false;
        } else {
          document.getElementById("password-error").style.display = "none";
        }

        // 验证考试机号
        if (!machineNumberInput.value.trim()) {
          document.getElementById("machine-number-error").style.display =
            "block";
          isValid = false;
        } else {
          document.getElementById("machine-number-error").style.display =
            "none";
        }

        return isValid;
      }

      // 登录按钮点击事件
      loginButton.addEventListener("click", () => {
        if (validateForm()) {
          // 发送登录请求到主进程
          ipcRenderer.send("login-request", {
            serverIp: serverIpInput.value.trim(),
            serverPort: serverPortInput.value.trim(),
            password: passwordInput.value.trim(),
            machineNumber: machineNumberInput.value.trim(),
          });

          // 禁用按钮，显示加载状态
          loginButton.disabled = true;
          loginButton.innerText = "正在连接...";
        }
      });

      // 接收主进程的登录响应
      ipcRenderer.on("login-response", (event, data) => {
        loginButton.disabled = false;
        loginButton.innerText = "登录";

        if (data.success) {
          console.log("登录成功");
          // 主进程会自动导航到学生登录页面
        } else {
          alert(`登录失败: ${data.message || "无法连接到服务器"}`);
        }
      });

      // 页面加载时自动填充已保存的配置
      window.addEventListener("DOMContentLoaded", () => {
        // 获取已保存的配置
        ipcRenderer.send("get-current-settings");

        // 接收已保存的配置
        ipcRenderer.on("current-settings", (event, settings) => {
          if (settings) {
            if (settings.serverIp) serverIpInput.value = settings.serverIp;
            if (settings.serverPort)
              serverPortInput.value = settings.serverPort;
            if (settings.serverPassword)
              passwordInput.value = settings.serverPassword;
            if (settings.machineNumber)
              machineNumberInput.value = settings.machineNumber;
          }
        });
      });
    </script>
  </body>
</html>
